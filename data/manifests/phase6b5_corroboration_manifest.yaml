created_at: '2026-10-15T20:34:49.093729+00:00'
governance:
  status: CORROBORATED_PROVISIONAL_EVIDENCE
  label_classification: CANDIDATE_SAR_FLOOD_EVIDENCE
  certified_ground_truth: false
  zero_ml_training_enforced: true
  zero_label_fabrication_enforced: true
event_target:
  event_id: E03
  title: Mumbai 1-2 July 2019 Monsoon Cloudburst Deluge
  study_domain: Mumbai Mithi River Catchment (EPSG:32643)
evidence_sources:
  source_1_precipitation:
    source_type: AUTHENTIC_GROUND_GAUGE_AND_SATELLITE_CATALOG
    provider: India Meteorological Department (IMD) / NASA Goddard Earth Sciences
      (GES DISC)
    observation_stations:
      imd_santacruz:
        station_id: IMD_43003_SANTACRUZ
        location: 19.08 deg N, 72.85 deg E (Mithi Basin Edge)
        24h_rainfall_total_mm: 375.2
        event_record_type: OFFICIAL_RECORD_METEOROLOGICAL_FORCE_MAJEURE
        observation_window: 2019-07-01T08:30:00+05:30 to 2019-07-02T08:30:00+05:30
        core_cloudburst_window: 2019-07-01T23:30:00+05:30 to 2019-07-02T05:30:00+05:30
          (>200 mm in 6 hr)
      imd_colaba:
        station_id: IMD_43057_COLABA
        location: 18.90 deg N, 72.82 deg E (South Mumbai)
        24h_rainfall_total_mm: 137.8
        spatial_gradient_note: Convective storm center was intensely localized over
          Mumbai suburban/Mithi catchment.
    satellite_imerg_status:
      product: NASA GPM IMERG Final Run V07B (0.1 deg, 30 min)
      local_repository_status: E03 July 2019 granules not yet acquired locally; E02
        August 2017 benchmark exists.
      scientific_utility: Validates regional macro-scale precipitation forcing; spatial
        resolution (approx 10 km) cannot delineate municipal street flooding.
    uncertainty: Gauge record has high local point accuracy; spatial interpolation
      across catchment introduces 10-15% volume uncertainty.
    conflation_guard: Rainfall forcing creates flood hazard, but rainfall volume alone
      does NOT constitute proof of surface inundation extent.
  source_2_deterministic_hydrodynamic_simulation:
    source_type: PHYSICAL_NUMERICAL_SOLVER_MODEL
    engine: Aquora Deterministic Hydrodynamic Simulation Engine (Diffusive Wave D8
      Routing)
    dem_source: SRTM / CartoDEM-derived 30m Master Raster (EPSG:32643)
    simulation_archive_status: 663 operational test/forecast simulation runs exist;
      historical 2 July 2019 simulation was not previously stored.
    topographical_convergence_metrics:
      open_water_drop_elevation_median_m: 25.92
      unclassified_dry_elevation_median_m: 25.76
      convergence_finding: SAR candidate open-water drops occur along low-elevation
        drainage pathways and coastal valley floors (median 25.92m).
    uncertainty: Model-dependent on DEM resolution (30m), Manning roughness parameterization,
      and absence of municipal storm pipe network data.
    conflation_guard: Deterministic simulation outputs are model-based what-if estimates,
      clearly separated from observed satellite microwave evidence.
  source_3_municipal_incident_and_rescue_records:
    source_type: AUTHORITATIVE_MUNICIPAL_DISASTER_LOGS
    agencies:
    - MCGM Disaster Management Dept
    - National Disaster Response Force (NDRF)
    - Mumbai Fire Brigade
    - Central Railway
    documented_incident_hotspots:
    - location: Kranti Nagar / Bail Bazar (Kurla West)
      impact: Mithi River overflowed banks; 1,000+ residents evacuated via NDRF boats
        pre-dawn.
      sar_evidence_overlap: Dense cluster of candidate flood evidence and urban double
        bounce along river margin.
    - location: Sion Railway Station & Rail Tracks
      impact: Suburban tracks submerged under 1.5m of water; Harbour and Central Line
        train services suspended 12+ hours.
      sar_evidence_overlap: Corroborated by high double bounce (> +4.5 dB) and open-water
        drop in rail corridor.
    - location: Bandra-Kurla Complex (BKC)
      impact: Severe road waterlogging; vehicular movement halted; underground basements
        flooded.
      sar_evidence_overlap: Corroborated by urban double-bounce corner-reflection
        candidate cells.
    - location: Malad East (Pophale Nagar)
      impact: Municipal reservoir wall collapse at 01:30 IST resulting in over 25
        fatalities.
      sar_evidence_overlap: Hillside location outside primary Mithi riverbank buffer.
    tidal_constraint: 4.59m high tide at 11:52 IST on 2 July 2019 created severe backwater
      lock at Mahim outfall.
    uncertainty: Qualitative incident reports confirm acute disruption locations,
      but lack official GIS inundation boundary polygons.
  source_4_sentinel1_temporal_baselines:
    source_type: SATELLITE_MICROWAVE_OBSERVATION
    pair_evaluated: 8 June 2019 (Pre) vs 2 July 2019 (Co-event)
    overpass_timing: 2 July 2019 at 06:32:58 IST (approx 1 hour after overnight cloudburst
      finished)
    pre_event_baseline_strengths: Clean dry-season baseline; clear distinction of
      permanent water bodies.
    pre_event_baseline_limitations: 24-day baseline gap crosses monsoon onset (25
      June); widespread background soil-wetting shift of +1.77 dB.
    optional_14_july_recession_scene:
      granule_name: S1A_IW_GRDH_1SDV_20190714T010258_20190714T010323_028106_032C97_F1F5
      role: POST_EVENT_MONSOON_RECESSION_BASELINE
      potential_advantage: Shares monsoon wet-soil state, cancelling out the +1.77
        dB seasonal shift.
      tradeoff_limitation: Acquired 12 days post-event; street-level flash flood water
        already drained within 24-48 hours.
      download_status: Verified in ASF DAAC catalog; kept optional to preserve storage
        budget without downloading.
