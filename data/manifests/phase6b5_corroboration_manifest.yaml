validation_gaps:
- 'Absence of Official GIS Inundation Polygons: MCGM and Maharashtra State Disaster
  Management Authority did not publish verified vector flood polygons for 2 July 2019.'
- 'Monsoon Onset Gap: 24-day baseline crosses the 25 June monsoon arrival, elevating
  background soil moisture by +1.77 dB.'
- 'Urban Canyon Multipath: Dihedral double-bounce reflects microwave backscatter increase,
  which can also be influenced by vehicles or construction scaffolding.'
- 'Drainage Network Association: 100% of catchments lack sub-surface municipal pipe
  dimensions in open public GIS layers.'
scientific_conclusion: Candidate SAR flood evidence (7,259 open-water drop cells and
  8,654 urban double-bounce cells) is strongly corroborated in spatial pattern by
  IMD ground precipitation records (375.2 mm/24h), tidal outfall lock (4.59m at 11:52
  IST), and municipal evacuation/submergence logs at Kurla and Sion. However, in accordance
  with AQUORA zero-fabrication standards, in the absence of authoritative municipal
  GIS inundation polygons, all outputs remain classified as PROVISIONAL CANDIDATE
  EVIDENCE, not certified ground truth.
