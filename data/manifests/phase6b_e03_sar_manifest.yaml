flood_labeling_scientific_limitations:
  - "SAR backscatter changes are candidate observational evidence, NOT verified ground truth."
  - "Seasonal Soil Wetting: Monsoon arrived 25 June. Bare soil moisture causes backscatter increases (+2 to +4 dB) that must not mask water."
  - "Urban Double-Bounce: Flooded streets between buildings can create corner-reflector anomalies that increase backscatter rather than decrease it."
  - "Permanent Water Masking: Arabian Sea, Mahim Bay, Thane Creek, and Mithi baseflow river channel must be masked using permanent water layers."
  - "Radar Shadow & Layover: Steep terrain and skyscrapers cause radar shadows that mimic specular water reflection."
  - "Independent Truth Boundary: Official municipal vector inundation polygons do NOT exist for July 2019; derived masks must be labeled as candidate flood evidence."
