    zero_elevation_ocean_pixels: Ocean is 0.0m in DSM, not NaN NoData. Requires explicit land/water masking.
    macrotidal_fluctuations: Bay of Bengal tidal range of 3-4m causes intertidal mudflat submergence/exposure.
    mangrove_canopy_flooding: Bhitarkanika mangrove stands experience tidal pulses and high canopy radar reflectance.
    shifting_estuarine_sandbars: Devi and Dhamra river mouths undergo dynamic post-monsoon sandbar migration.

dsm_structural_limitations:
  sensor: TanDEM-X X-band (3.1 cm) radar interferometry
  reflective_surface: First-return surface (vegetation canopy and artificial structures)
  bare_earth_dtm: FALSE
  vegetation_damming_risk: Dense coastal mangroves (Bhitarkanika) and riparian tree belts elevate elevations by 5-20m, creating artificial barriers across drainage paths.
  urban_structural_bias: Settlement structures in Cuttack and Bhubaneswar elevate elevations by 3-15m.
  mitigation_requirements:
  - Stream burning using authoritative river centerlines.
  - Breach depression / selective sink filling algorithms.
  - Vegetation canopy bias evaluation (FABDEM / MERIT DEM comparison).

proposed_terrain_workflow:
  stage_1: Multi-source land/water composite mask preparation (Ocean, Tidal Mudflat, Permanent Water, Terrestrial).
  stage_2: Virtual mosaic (VRT) assembly across 9 tiles with zero-modification to raw COGs.
  stage_3: Stream burning and hydrologic conditioning using authoritative river vectors.
  stage_4: Derivation of 30m terrain features (Slope, Aspect, Curvature, Flow Accumulation, TWI, HAND).
  stage_5: Spatial aggregation and grid alignment to DFO 3382 250m observation cells.
  execution_status: PROPOSED_WORKFLOW_ONLY (Execution strictly deferred until data acquisition is authorized).

