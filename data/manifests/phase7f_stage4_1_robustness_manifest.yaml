    aspect_mean_cos_formula: "mean(cos(aspect_deg * pi / 180.0)); measures Northness (+1=North, -1=South); monsoonal atmospheric inflow claim REFUTED."
    aspect_mean_sin_formula: "mean(sin(aspect_deg * pi / 180.0)); measures Eastness (+1=East, -1=West)."
    aspect_circular_var_formula: "1.0 - sqrt(mean_cos^2 + mean_sin^2); Mardia's circular variance measuring directional dispersion; valley/chaotic plain claim REFUTED."
