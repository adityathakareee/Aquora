epsilon_gradient_audit:
  mathematical_rule: filled_elevation = max(z_spillway + epsilon, raw_elevation)
  epsilon_parameter_value: 0.0001
  epsilon_type: CONSTANT_PER_CELL_INCREMENT (not distance-weighted by cell spacing)
  diagonal_vs_orthogonal_treatment:
    priority_flood_fill: Epsilon (1e-4 m) is added uniformly to all unvisited neighbors
      regardless of step direction. Effective numerical gradient along orthogonal
      paths is 1e-4 / 30m = 3.33e-6 m/m; along diagonal paths it is 1e-4 / 42.43m
      = 2.36e-6 m/m.
    d8_flow_direction: 'Steepest descent drop calculation strictly normalizes elevation
      difference by true Euclidean distance: drop = (z_center - z_neighbor) / (30.0
      * sqrt(2)) for diagonals, and / 30.0 for orthogonals.'
  lake_and_coastline_handling:
