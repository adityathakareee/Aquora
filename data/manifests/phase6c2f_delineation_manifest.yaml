final_decision:
  decision: EXPLORATORY_ONLY / BLOCKED FOR SIMULATION
  reason: 'Delineation cannot be promoted to authoritative or used in historical flood
    simulation because: (1) proposed pour point lands on an elevated road structure
    (+9.95m MSL), (2) CSMIA runway culvert lacks georeferenced centerline vector,
    forcing unphysical brute-force depression filling (+6.7m at airport, +3.7m in
    BKC), and (3) no independent GIS boundary polygon exists for validation. Delineation
    remains strictly EXPLORATORY ONLY.'
  evidence_required_for_unblocking:
  - Official georeferenced CAD / GIS vector alignment of CSMIA triple-box culvert
    centerline with invert elevations.
  - Surveyed bridge opening hydraulic cross-sections for Western and Central Railway
    embankments.
  - Georeferenced pour point located in the active Mahim Creek intertidal channel
    (e.g. Row 655, Col 100 or Row 635, Col 84) rather than the Causeway road deck.
  - Survey of India geodetic tidal tie sheet for Mumbai Port Chart Datum to EGM96
    MSL reduction.
