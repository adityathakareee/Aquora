unresolved_scientific_questions:
- question_1: Will HydroRIVERS D8 single-flow dendritic reaches sufficiently capture anabranching distributaries below Naraj Barrage, or will supplemental canal centerlines be mandatory?
- question_2: What empirical stream-burning depth (e.g. 1.5m vs 3.0m) avoids over-excavating alluvial delta flats while overcoming DSM canopy damming in Bhitarkanika?
- question_3: How will dynamic tidal flats and seasonal aquaculture ponds along Chilika Lagoon be validated without concurrent SAR ground-truth?

