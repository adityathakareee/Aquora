    geographic_coverage: Continental Asia (encompasses full Mahanadi Basin, PFAF_ID 4527)
    native_crs: EPSG:4326 (WGS 84)
    resolution_scale: Derived from 15 arc-sec (~500m) conditioned SRTM elevation
    suitability_for_dfo3382: High. Level 7 and Level 8 sub-basins isolate the delta distributaries below Naraj Barrage bifurcation.
