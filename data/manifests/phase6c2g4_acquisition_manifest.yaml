go_no_go_decision:
  decision: "BLOCKED \u2014 AUTHORITATIVE EVIDENCE UNAVAILABLE"
  justification: 'Primary-source retrieval rigorously verified the published benchmarks
    and bibliographic identities: (1) The Chitale Committee 2006 report verifies the
    72.95 sq km tabular breakdown (p. 64) but provides no GIS polygon. (2) Zope et
    al. (2015, DOI: 10.1007/s11069-014-1356-4) reports 70.57 sq km but hosts no open
    geospatial data. (3) Mumbai Port Authority confirms MSL = CD + 2.51 m, but continuous
    1-2 July 2019 water levels and the EGM96 geodetic tie remain unavailable. (4)
    Essential engineering datasets (MIAL culvert as-built CAD, MCGM drainage shapefiles)
    are restricted municipal records requiring human authorization. In strict compliance
    with Master Engineering Instructions, fabricating culverts or forcing delineation
    without genuine primary geometry is forbidden.'
