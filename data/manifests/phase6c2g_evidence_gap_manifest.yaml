decision_rationale:
  chosen_decision: "BLOCKED \u2014 AUTHORITATIVE EVIDENCE UNAVAILABLE"
  justification: 'Authoritative watershed delineation and pour-point finalization
    remain strictly BLOCKED because: (1) The proposed Mahim Causeway coordinate is
    verified to land on an elevated road deck (+9.95m MSL). (2) Candidate channel
    cell (Row 655, Col 100) lacks surveyed cross-sectional bathymetry to separate
    water from bridge infrastructure at 30m resolution. (3) CSMIA airport culvert
    lacks georeferenced CAD/GIS centerline geometry, preventing physical connectivity
    without unphysical depression filling (+6.71m at Marol, +3.76m at Powai Lake).
    (4) No surveyed municipal GIS boundary polygon exists for independent validation.'
  unblocking_requirements:
  - Official georeferenced CAD as-built drawing of CSMIA Runway 09/27 box culvert
    with bed inverts.
  - Municipal surveyed cross-sections of the Mahim Causeway bridge outfall opening.
  - MCGM BRIMSTOWAD master plan digital GIS watershed boundary shapefile.
