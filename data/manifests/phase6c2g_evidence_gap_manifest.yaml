authoritative_evidence_catalog:
  category_1_channel_and_outlet_geometry:
    title: OpenStreetMap Waterway Network & Copernicus DSM Topographic Transect
    publisher: OpenStreetMap Foundation / European Space Agency
    date: 2024 / 2021
    identifier_or_url: https://www.openstreetmap.org/ / https://spacedata.copernicus.eu/
    extracted_statement: OpenStreetMap vector layer represents the Mithi River centerline
      as a polyline terminating under the Mahim Causeway bridge into Mahim Bay. Copernicus
      DSM captures the water surface at 0.0m - 0.32m MSL adjacent to a +9.95m MSL
      road-deck embankment.
    geographic_coverage: Mahim Creek to Vihar Lake (Mumbai, India)
    vertical_datum: EGM96 Geoid (DSM) / Not applicable (OSM 2D polyline)
    verification_status: APPROXIMATE SPATIAL EVIDENCE
    spatial_limitations: OSM polyline has ~10-20m horizontal uncertainty and zero
      bathymetric profile. Copernicus DSM lacks sub-grid channel bathymetry and blends
      road deck with water surface.
  category_2_csmia_airport_culvert:
    title: Report of the Fact-Finding Committee on Mumbai Floods of 26th July 2005
      (Chitale Committee)
    publisher: Government of Maharashtra
    date: March 2006
    identifier_or_url: Official GoM Inquiry Report, Chapter 5 ('Mithi River and Its
      Catchment'), pp. 62-75
    extracted_statement: The Mithi River crosses under CSMIA Runway 09/27 and Runway
      14/32 via a triple-barrel reinforced concrete box culvert (3 spans of 20m each,
      total width 60m). The upstream bed invert is designed at +2.50m MSL and downstream
      at +2.10m MSL.
    geographic_coverage: "CSMIA Runway Crossing (~19.090\xB0N, 72.875\xB0E)"
    vertical_datum: Great Trigonometrical Survey (GTS) / Mumbai MSL
    verification_status: VERIFIED PRIMARY SOURCE (Tabular Specs) / NOT AVAILABLE (Georeferenced
      Vector)
    spatial_limitations: Engineering dimensions and inverts are authoritative in text,
      but no georeferenced CAD drawing, as-built GIS polyline, or surveyed headwall
      coordinate exists in open public records. Burning a guessed trench violates
      the zero-fabrication invariant.
  category_3_railway_and_highway_crossings:
    title: MMRDA Mithi River Development Plan & Central/Western Railway Bridge Inventory
    publisher: Mumbai Metropolitan Region Development Authority / Ministry of Railways
    date: 2006-2015
    identifier_or_url: MMRDA Engineering Reports & OpenStreetMap Infrastructure Tags
    extracted_statement: 'Multiple bridges cross the lower Mithi: Western Railway
      bridge (Mahim/Bandra), Western Express Highway Kalanagar bridge, Central Railway
      bridge (Sion/Kurla), Santacruz-Chembur Link Road bridge. All restrict channel
      width and present elevated ballast/roadway embankments (+4m to +10m MSL) in
      surface DSM.'
    geographic_coverage: Lower Mithi River Corridor (Mahim to Kurla)
    vertical_datum: Local MSL
    verification_status: APPROXIMATE SPATIAL EVIDENCE (Locations) / NOT AVAILABLE
      (Surveyed Inverts)
    spatial_limitations: Bridge opening cross-sectional areas and bed pier inverts
      are not published in open GIS format. In unconditioned DSM, they act as solid
      artificial dams across the river reach.
  category_4_chitale_catchment_benchmark:
    title: Report of the Fact-Finding Committee on Mumbai Floods of 26th July 2005
    publisher: Government of Maharashtra
    date: March 2006
    identifier_or_url: Official GoM Inquiry Report, Chapter 4 ('Lakes and Reservoirs')
      & Chapter 5, p. 64
    extracted_statement: Total catchment area of the Mithi River basin is 72.95 sq
      km, comprising Vihar Lake catchment (18.96 sq km), Powai Lake catchment (6.61
      sq km), and direct river catchment downstream of the lakes (47.38 sq km).
    geographic_coverage: Mithi River Watershed (Mumbai suburban district)
    vertical_datum: Not applicable (Surface Area Benchmark)
    verification_status: VERIFIED PRIMARY SOURCE (Tabular Benchmark) / NOT AVAILABLE
      (GIS Vector Boundary)
    spatial_limitations: Authoritative as a planning and hydrological benchmark. However,
      no authoritative GIS boundary shapefile was published with the report. Boundaries
      were delineated on 1:50,000 Survey of India toposheets.
  category_5_vertical_datum_reduction:
    title: Mumbai Port Trust Hydrographic Parameters & Survey of India Geodetic Datum
      Specifications
    publisher: Mumbai Port Authority (MbPA) / Survey of India
    date: 2020 / 2024
    identifier_or_url: https://mumbaiport.gov.in/ (Navigation & Hydrographic Details)
    extracted_statement: 'Mean Sea Level (MSL) at Mumbai is officially established
      at +2.51 meters above Mumbai Port Chart Datum (CD). Highest High Water is +5.39m
      CD; Mean High Water Spring is +4.42m CD; Mean Low Water Spring is +0.76m CD.
      Reduction formula: z_MSL = z_CD - 2.51m.'
    geographic_coverage: Mumbai Harbour, Mahim Bay, and Coastal Mumbai
    vertical_datum: Mumbai Port Chart Datum (CD) / Great Trigonometrical Survey (GTS)
      MSL
    verification_status: VERIFIED PRIMARY SOURCE (CD to MSL formula) / APPROXIMATE
      (Local MSL to EGM96 Geoid)
    spatial_limitations: "The offset z_MSL = z_CD - 2.51m is verified for local tide\
      \ gauge datum. However, local MSL relates to the Copernicus DEM EGM96 geoid\
      \ with a regional geoid undulation uncertainty of \xB10.3m to \xB10.5m. Injecting\
      \ unreduced +4.59m CD directly into DEM submerges BKC under artificial seawater."
