known_limitations:
- Spatial resolution is native MODIS 250m; sub-pixel distributary channels and village levees are not resolved.
- Temporal coverage begins 2008-09-22, missing the initial rising limb and reservoir filling phase (15-21 Sept).
- Copernicus DEM 30m tiles (N19E085, N19E086, N20E085, N20E086) and CHIRPS precipitation (2008.09.20-26) are not yet acquired or aligned.
- Holdout quarantine for DFO 2507 remains strictly independent and unaffected.
