  model_training_features_10:
  - rainfall_1h_mm
  - rainfall_3h_mm
  - rainfall_6h_mm
  - rainfall_24h_mm
  - rainfall_72h_mm
  - rainfall_anomaly_index
  - elevation_m
  - slope_deg
  - distance_to_river_m
  - landcover_class
  feature_leakage_and_semantics_audit:
    historical_flood_frequency:
      source: GFD 2000-2018 national catalog
      audit_finding: EXCLUDED_FROM_MODEL_TRAINING
      rationale: Future data leakage (computed from 2000-2018 catalog, encompassing
        events up to 14 years after DFO 2507) and zero intra-basin spatial variance
        (basin event proxy).
    rainfall_anomaly_index:
      source: Derived from rainfall_72h_mm and fixed baseline parameters
      audit_finding: COLLINEAR_WITH_RAINFALL_72H
      rationale: Exact linear affine transformation within each event footprint (r
        = 1.0000). Provides zero independent variance but introduces no future leakage.
    distance_to_river_m:
      source: GFD Band 5 (JRC Global Surface Water permanent water mask)
      audit_finding: SEMANTIC_CLARIFICATION_REQUIRED
      rationale: Represents Euclidean metric distance to perennial open water bodies
        (lakes, reservoirs, major river channels), not an explicit vector river network.
        Retained for schema compliance.
    landcover_class:
      source: ESA WorldCover 2021 (10m)
      audit_finding: TEMPORAL_MISMATCH_DOCUMENTED
      rationale: 2021 baseline introduces a 4-to-17 year temporal gap relative to
        historical disaster events (2004, 2006, 2008, 2017).
    unobserved_subdaily_rainfall:
      features:
      - rainfall_1h_mm
      - rainfall_3h_mm
      - rainfall_6h_mm
      treatment: PRESERVED_AS_EXPLICIT_NAN
      policy: Zero synthetic filling or imputation; native tree routing required
scientific_limitations:
- 'Natural Test Class Imbalance: Held-out test set preserves the unskewed natural
  population (5.82% flood prevalence, 185,070 dry vs 11,435 flood). Precision and
  PR-AUC reflect real-world false alarm vulnerability.'
- 'Cross-Basin Generalization Gap: Absolute elevation does not generalize across distinct
  river basins without relative hydrologic normalization (e.g. HAND); the model underperforms
  simple inverted elevation ranking within the test basin.'
- 'Temporal Mismatch: Land cover is derived from ESA WorldCover 2021 (10m), carrying
  temporal offsets for historical events.'
- 'Sub-daily Rainfall Absence: Daily CHIRPS product cannot resolve 1h, 3h, or 6h flash
  storm peaks; features are strictly missing (NaN).'
- 'Governance Status: EXPERIMENTAL_EVALUATION_ONLY. Not calibrated or approved for
  civil defense, flood forecasting, or evacuation planning.'
