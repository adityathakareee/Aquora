physical_engine_federation:
  service: "FloodProcessingService (db=None)"
  solver: "engines.flood.solver.run_flood_simulation_loop"
  forcing: "Open-Meteo ECMWF IFS Global Numerical Weather Prediction"
  mass_balance_invariant: "overall_mass_balance_error_m3 <= 1e-4"
  opt_in_policy: "Point inspection (/deep) does NOT automatically launch simulations."

api_endpoints:
