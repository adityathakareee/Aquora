    type: "POINT_INSPECTION"
    description: "High-resolution 30m terrain raster sampling with opt-in simulation"
  - path: "POST /api/v1/intelligence/deep/simulate"
    type: "SIMULATION_EXECUTION"
    description: "On-demand 2D hydrodynamic simulation with mass-balance and facility impacts"

